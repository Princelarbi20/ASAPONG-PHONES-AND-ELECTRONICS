
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "10000"
    expose:
      - "10000"

  frontend:
    build:
      context: .
      dockerfile: frontEnd/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      PORT: "10000"
      API_PROXY_TARGET: http://backend:10000
    ports:
      - "8080:10000"
    depends_on:
      - backend
