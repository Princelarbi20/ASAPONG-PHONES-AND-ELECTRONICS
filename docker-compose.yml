
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asa-phones-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
    container_name: asa-phones-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
