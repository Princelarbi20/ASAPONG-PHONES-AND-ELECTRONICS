
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      PORT: "10000"
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "8080:10000"
    depends_on:
      - backend
